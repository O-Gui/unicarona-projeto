version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: unicarona-db
    restart: always
    environment:
      POSTGRES_USER: unicarona_admin
      POSTGRES_PASSWORD: senha_segura_123
      POSTGRES_DB: unicarona_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: